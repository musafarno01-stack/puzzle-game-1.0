name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK with Godot 4
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.1
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.2.1.stable
          mv /root/.local/share/godot/export_templates/4.2.1.stable/* ~/.local/share/godot/export_templates/4.2.1.stable/ || true

      - name: Create Build Directory
        run: mkdir -p build/android

      - name: Export Android APK
        run: godot --headless --export-debug "Android" build/android/PrismBlocks.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: PrismBlocks-Android-APK
          path: build/android/PrismBlocks.apk
